<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>高光谱调研 · 设计原型</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e6e8e7;background:#111413;--muted:#a1aaa5;--line:#303733;--green:#b4d6bd}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button,select{cursor:pointer}button{color:inherit;background:none;border:0}a{color:inherit;text-decoration:none}button:hover,a:hover{color:var(--green)}:focus-visible{outline:2px solid var(--green);outline-offset:4px}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid var(--line);background:#151917}header strong{letter-spacing:.04em}header small{color:var(--muted);font-weight:400;letter-spacing:0;margin-left:16px}.prototype-note{padding:9px 38px;color:#c6c5aa;background:#23241d;font-size:12px}.intro{padding:32px 38px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:28px;font-weight:550;margin:0 0 6px;letter-spacing:-.04em}p{margin:0;color:var(--muted)}.intro-note{font-size:13px;color:var(--muted);text-align:right}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);gap:34px;margin:0 38px 60px}aside{padding:20px 18px 20px 0;border-top:1px solid var(--line)}.aside-title{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:0 10px 18px}.category{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:10px 12px;border-radius:5px;margin:3px 0;font-size:14px}.category b{font-size:12px;font-weight:400;color:var(--muted)}.category.active{color:var(--green);background:#24322a}.category.active b{color:var(--green)}.category-group{border-top:1px solid var(--line);margin-top:17px;padding-top:15px}.aside-help{margin:28px 12px;font-size:12px;color:var(--muted);line-height:1.9}.content{min-width:0}.toolbar{padding-top:18px;border-top:1px solid var(--line)}.search{width:100%;background:#1b201d;border:1px solid #3a433d;border-radius:7px;padding:13px 16px;color:inherit}.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}select{min-width:120px;max-width:100%;color:#cbd1cd;background:#171c19;border:1px solid var(--line);border-radius:5px;padding:8px 12px;font-size:13px}.results-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 10px;font-size:13px;color:var(--muted)}.results-bar b{color:#e6e8e7}.results-bar select{border:0;background:transparent;padding-right:0}.paper-row{display:block;text-align:left;width:100%;padding:22px 0;border-top:1px solid var(--line)}.paper-row:hover{color:inherit;background:#171d19}.paper-meta{color:var(--muted);font-size:12px;margin-bottom:7px;display:flex;justify-content:space-between;gap:10px}.paper-row h2{font-size:19px;font-weight:550;margin:0 0 4px;line-height:1.4}.full-title{color:#bbc3bd;font-size:13px;margin-bottom:8px;overflow-wrap:anywhere}.summary{font-size:13px;line-height:1.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:950px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{font-size:11px;background:#242b26;color:#b9c9bd;padding:2px 8px;border-radius:4px}.tag.pending{background:#2c2921;color:#c7bd9e}.empty{padding:65px 20px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}.clear{color:var(--green);font-size:13px;padding:6px 0}.mobile-toggle,.mobile-close{display:none}dialog{color:inherit;background:#181e1a;border:1px solid #414b43;padding:30px;width:min(650px,100%);max-height:100dvh;height:100dvh;margin:0 0 0 auto;overflow:auto}dialog::backdrop{background:#0008}dialog h2{font-size:26px;margin:30px 0 10px}dialog h3{font-size:13px;color:var(--green);margin:26px 0 9px}dialog p{font-size:14px;color:#c3ccc5}dialog .close{float:right;font-size:14px}dialog a{display:inline-block;margin-top:30px;color:var(--green)}.detail-note{padding:10px 12px;background:#272920;font-size:12px;margin-top:16px}#mobile-shade{display:none}
@media(min-width:1700px){.layout,.intro{max-width:1540px;margin-left:auto;margin-right:auto}}
@media(max-width:760px){header{height:60px;padding:0 18px;font-size:13px}header small{display:none}.prototype-note{padding:9px 18px;font-size:11px}.intro{padding:26px 18px 20px;display:block}.intro-note{display:none}h1{font-size:25px}.intro p{font-size:13px}.layout{display:block;margin:0 18px 40px}.layout>aside{display:none;position:fixed;left:0;top:0;bottom:0;width:290px;z-index:5;padding:24px 18px;background:#171d19;border-right:1px solid var(--line);overflow:auto}body.categories-open aside{display:block}body.categories-open #mobile-shade{display:block;position:fixed;inset:0;background:#0009;z-index:4}.mobile-toggle{display:block;border:1px solid var(--line);padding:8px 12px;border-radius:5px;font-size:13px}.mobile-close{display:block;margin:0 0 25px auto}.filter-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.filter-row .clear{text-align:left}select{min-width:0;flex:1;padding:8px;font-size:12px}.search{font-size:14px}.paper-row h2{font-size:18px}.results-bar{font-size:12px}.results-bar select{flex:none;max-width:120px}.paper-row{padding:20px 0}dialog{padding:22px;width:100%;border:0}.paper-meta{font-size:11px}.toolbar{padding-top:14px}}
</style>
</head>
<body>
<header><strong>HSI Research <small>高光谱调研</small></strong><a href="../?view=atlas">返回三维视觉专题 ↗</a></header>
<div class="prototype-note">设计原型 · 仅展示 8 篇已有论文样例；分类与阅读进度为演示值，不修改正式文献。</div>
<section class="intro"><div><h1>高光谱调研</h1><p>已调研论文，持续整理。分类随阅读逐步形成。</p></div><div class="intro-note">先收录，再阅读与归类<br>跨方向论文可拥有多个分类</div></section>
<div id="mobile-shade"></div>
<main class="layout">
<aside id="categories" aria-label="论文分类"><button class="mobile-close" type="button">关闭分类 ×</button><div class="aside-title"><span>论文分类</span><span>持续整理</span></div><div id="category-list"></div><p class="aside-help">分类来自已调研论文。<br>同一篇论文可以属于多个分类，数量按论文去重。</p></aside>
<section class="content" aria-label="调研论文列表">
<div class="toolbar"><input id="search" class="search" type="search" placeholder="搜索论文、方法或研究问题…" aria-label="搜索论文"><div class="filter-row"><button type="button" class="mobile-toggle" aria-expanded="false" aria-controls="categories">分类</button><select id="year" aria-label="年份"><option value="">全部年份</option></select><select id="venue" aria-label="出版来源"><option value="">全部出版来源</option></select><select id="reading" aria-label="阅读进度"><option value="">全部阅读进度</option><option>待阅读</option><option>摘要已读</option><option>全文已读</option></select><button type="button" class="clear" id="reset">清除筛选</button></div></div>
<div class="results-bar"><span id="results" role="status"></span><select id="sort" aria-label="排序"><option value="newest">发表年份 · 最新优先</option><option value="oldest">发表年份 · 最早优先</option></select></div>
<div id="papers"></div>
</section>
</main>
<dialog id="detail" aria-labelledby="detail-title"><button type="button" class="close">关闭详情 ×</button><div id="detail-body"></div></dialog>
<script>
const papers = [{"id": "hs-nerf", "shortTitle": "HS-NeRF", "title": "Hyperspectral Neural Radiance Fields", "year": 2024, "venue": "arXiv", "summary": "在三维空间与观察方向上建立波长相关的辐射和透射表示，将神经辐射场扩展到高光谱场景。", "input": "多视角高光谱图像", "output": "高光谱三维辐射场与新视角图像", "mechanism": "联合建模位置、方向和波长相关的辐射与透射光谱，探索高光谱超分辨率与成像传感器仿真。", "paper": "https://arxiv.org/abs/2403.14839", "scope": "核心研究", "labels": ["新视角合成"], "reading": "全文已读"}, {"id": "spectralnerf", "shortTitle": "SpectralNeRF", "title": "SpectralNeRF: Physically Based Spectral Rendering with Neural Radiance Field", "year": 2024, "venue": "AAAI", "summary": "先生成不同波长下的光谱图，再融合为 RGB 图像，以光谱渲染视角建模新视角合成。", "input": "光线原点与方向；训练观测设置见原文", "output": "新视角光谱图与白光照明下的 RGB 图像", "mechanism": "SpectralMLP 构建光谱辐射场，Spectrum Attention UNet 将光谱图组合为 RGB 输出。", "paper": "https://ojs.aaai.org/index.php/AAAI/article/view/28099", "scope": "相关研究", "labels": ["新视角合成"], "reading": "摘要已读"}, {"id": "hypergs", "shortTitle": "HyperGS", "title": "HyperGS: Hyperspectral 3D Gaussian Splatting", "year": 2025, "venue": "CVPR", "summary": "将高光谱信息纳入三维高斯场景表示，探索高光谱场景的新视角渲染。", "input": "多视角高光谱观测", "output": "高光谱三维高斯场景与新视角图像", "mechanism": "在三维高斯中表示潜在高光谱特征，并通过密度控制和剪枝支持高光谱场景优化。", "paper": "https://openaccess.thecvf.com/content/CVPR2025/html/Thirgood_HyperGS_Hyperspectral_3D_Gaussian_Splatting_CVPR_2025_paper.html", "scope": "核心研究", "labels": ["新视角合成"], "reading": "待阅读"}, {"id": "unmix-nerf", "shortTitle": "UnMix-NeRF", "title": "UnMix-NeRF: Spectral Unmixing Meets Neural Radiance Fields", "year": 2025, "venue": "ICCV", "summary": "将光谱解混融入神经辐射场，联合实现高光谱新视角合成和无监督材料分割。", "input": "高光谱场景观测", "output": "高光谱新视角图像、材料分割与材料外观编辑", "mechanism": "通过漫反射与镜面反射分量建模光谱反射率；学习全局端元字典表示纯材料光谱，以每点丰度描述材料分布。", "paper": "https://openaccess.thecvf.com/content/ICCV2025/html/Perez_UnMix-NeRF_Spectral_Unmixing_Meets_Neural_Radiance_Fields_ICCV_2025_paper.html", "scope": "核心研究", "labels": ["新视角合成", "光谱解混"], "reading": "全文已读"}, {"id": "mps-well-posed", "shortTitle": "MPS · Well Posed?", "title": "Multispectral Photometric Stereo for Spatially-Varying Spectral Reflectances: A Well Posed Problem?", "year": 2021, "venue": "CVPR", "summary": "分析多光谱光度立体的适定条件，在均匀色度、空间变化反照率假设下恢复表面法线和光谱反射率。", "input": "不同光谱照明下的多波段观测", "output": "表面法线与光谱反射率", "mechanism": "根据共享色度的表面点数量与光谱光源数量建立可唯一求解的条件，并利用多波段冗余提高对异常观测的稳健性。", "paper": "https://openaccess.thecvf.com/content/CVPR2021/html/Guo_Multispectral_Photometric_Stereo_for_Spatially-Varying_Spectral_Reflectances_A_Well_Posed_CVPR_2021_paper.html", "scope": "相关研究", "labels": [], "reading": "摘要已读"}, {"id": "snapshot-hlf", "shortTitle": "Snapshot H-LF", "title": "Snapshot Hyperspectral Light Field Imaging", "year": 2017, "venue": "CVPR", "summary": "利用互补的角度与光谱采样，在单次曝光中重建多视角高光谱光场。", "input": "混合相机取得的角度和光谱压缩观测", "output": "9×9角度视图、27个光谱波段的五维光场", "mechanism": "结合光场相机与编码孔径光谱成像系统，使用自学习字典利用角度和光谱之间的相关性重建光场。", "paper": "https://openaccess.thecvf.com/content_cvpr_2017/html/Xiong_Snapshot_Hyperspectral_Light_CVPR_2017_paper.html", "scope": "核心研究", "labels": ["成像系统"], "reading": "待阅读"}, {"id": "neuralmps", "shortTitle": "NeuralMPS", "title": "Non-Lambertian Multispectral Photometric Stereo via Spectral Reflectance Decomposition", "year": 2023, "venue": "IJCAI", "summary": "通过光谱反射率分解，把非朗伯多光谱光度立体转化为具有未知光强的传统光度立体问题。", "input": "多光谱照明下的单次多光谱图像", "output": "非朗伯表面的法线与形状", "mechanism": "分离反射率中的几何和光谱分量；均匀材料条件下建立与传统光度立体的等价关系，再使用神经网络估计法线。", "paper": "https://www.ijcai.org/proceedings/2023/139", "scope": "相关研究", "labels": [], "reading": "全文已读"}, {"id": "3dis", "shortTitle": "3DIS", "title": "3D Imaging Spectroscopy for Measuring Hyperspectral Patterns on Solid Objects", "year": 2012, "venue": "TOG", "summary": "把高分辨率光谱成像接入三维扫描流程，测量实体表面的几何、漫反射光谱和荧光。", "input": "高光谱辐射观测与三角测量三维扫描", "output": "实体表面的三维高光谱反射率与荧光图样", "mechanism": "结合色散与带通成像，将359–1003 nm范围的高光谱观测和分块三维几何融合，建立端到端三维成像光谱测量系统。", "paper": "https://mail.minhkim.org/siggraph2012/index.html", "scope": "核心研究", "labels": ["成像系统"], "reading": "摘要已读"}];
const allLabels = [...new Set(papers.flatMap(p => p.labels))];
const selectedLabels = new Set();
let mode = 'all';
const el = id => document.getElementById(id);
const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for (const year of [...new Set(papers.map(p => p.year))].sort((a,b) => b-a)) el('year').add(new Option(year, year));
for (const venue of [...new Set(papers.map(p => p.venue))].sort()) el('venue').add(new Option(venue, venue));
function baseMatches(p) {
  const words = el('search').value.trim().toLowerCase().split(/\s+/);
  const text = `${p.shortTitle} ${p.title} ${p.summary} ${p.labels.join(' ')}`.toLowerCase();
  return words.every(word => text.includes(word)) && (!el('year').value || p.year === Number(el('year').value)) && (!el('venue').value || p.venue === el('venue').value) && (!el('reading').value || p.reading === el('reading').value);
}
function render() {
  const base = papers.filter(baseMatches);
  const count = label => base.filter(p => p.labels.includes(label)).length;
  const button = (key, label, total, active) => `<button type="button" class="category ${active?'active':''}" data-category="${escapeHtml(key)}" aria-pressed="${active}"><span>${escapeHtml(label)}</span><b>${total}</b></button>`;
  el('category-list').innerHTML = button('all','全部论文',base.length,mode==='all'&&!selectedLabels.size) + button('pending','待分类',base.filter(p=>!p.labels.length).length,mode==='pending') + '<div class="category-group">' + allLabels.map(label=>button(label,label,count(label),selectedLabels.has(label))).join('') + '</div>';
  const visible = base.filter(p => mode==='pending' ? !p.labels.length : !selectedLabels.size || p.labels.some(label => selectedLabels.has(label))).sort((a,b) => (el('sort').value==='oldest'?a.year-b.year:b.year-a.year)||a.shortTitle.localeCompare(b.shortTitle));
  const selection = mode==='pending' ? '待分类' : [...selectedLabels].join('、') || '全部论文';
  el('results').innerHTML = `显示 <b>${visible.length}</b> / ${papers.length} 篇样例 · ${escapeHtml(selection)}`;
  el('papers').innerHTML = visible.length ? visible.map(p=>`<button type="button" class="paper-row" data-paper="${escapeHtml(p.id)}"><div class="paper-meta"><span>${escapeHtml(p.venue)} · ${p.year}</span><span>${escapeHtml(p.reading)} · 示例</span></div><h2>${escapeHtml(p.shortTitle)} <span aria-hidden="true">↗</span></h2><div class="full-title">${escapeHtml(p.title)}</div><p class="summary">${escapeHtml(p.summary)}</p><div class="tags">${p.labels.length?p.labels.map(label=>`<span class="tag">${escapeHtml(label)}</span>`).join(''):'<span class="tag pending">待分类</span>'}</div></button>`).join('') : `<div class="empty">${mode==='pending'&&!base.length?'当前筛选下没有待分类论文':'没有匹配的论文'}<br><button type="button" class="clear" data-reset>清除筛选</button></div>`;
}
function reset() { mode='all'; selectedLabels.clear(); for (const key of ['search','year','venue','reading']) el(key).value=''; render(); }
function closeCategories() { document.body.classList.remove('categories-open'); document.querySelector('.mobile-toggle').setAttribute('aria-expanded','false'); el('categories').removeAttribute('role');el('categories').removeAttribute('aria-modal');document.querySelector('.mobile-toggle').focus(); }
el('category-list').addEventListener('click',event=>{ const button=event.target.closest('[data-category]'); if(!button)return;const key=button.dataset.category;if(key==='all'||key==='pending'){mode=key;selectedLabels.clear();}else{mode='all';selectedLabels.has(key)?selectedLabels.delete(key):selectedLabels.add(key);}render();el('category-list').querySelector(`[data-category="${key}"]`).focus(); });
for (const id of ['search','year','venue','reading','sort']) el(id).addEventListener(id==='search'?'input':'change',render);
el('reset').addEventListener('click',reset);
el('papers').addEventListener('click',event=>{if(event.target.closest('[data-reset]'))return reset();const button=event.target.closest('[data-paper]');if(!button)return;const p=papers.find(p=>p.id===button.dataset.paper);el('detail-body').innerHTML=`<h2 id="detail-title">${escapeHtml(p.shortTitle)}</h2><p>${escapeHtml(p.title)}</p><div class="detail-note">分类、阅读进度仅为原型示例；以下研究摘要与方法来自现有目录。</div><h3>研究问题与摘要</h3><p>${escapeHtml(p.summary)}</p><h3>输入</h3><p>${escapeHtml(p.input)}</p><h3>输出</h3><p>${escapeHtml(p.output)}</p><h3>方法</h3><p>${escapeHtml(p.mechanism)}</p><h3>与现有三维专题的关系</h3><p>${escapeHtml(p.scope)}</p><a href="${escapeHtml(p.paper)}" target="_blank" rel="noreferrer">查看论文原始来源 ↗</a>`;el('detail').showModal();});
el('detail').querySelector('.close').addEventListener('click',()=>el('detail').close());
document.querySelector('.mobile-toggle').addEventListener('click',()=>{document.body.classList.add('categories-open');document.querySelector('.mobile-toggle').setAttribute('aria-expanded','true');el('categories').setAttribute('role','dialog');el('categories').setAttribute('aria-modal','true');document.querySelector('.mobile-close').focus();});
document.querySelector('.mobile-close').addEventListener('click',closeCategories);
el('mobile-shade').addEventListener('click',closeCategories);
document.addEventListener('keydown',event=>{if(!document.body.classList.contains('categories-open'))return;if(event.key==='Escape'){closeCategories();return;}if(event.key==='Tab'){const buttons=[...el('categories').querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
render();
</script>
</body>
</html>
